<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUS MSBA Build with Antigravity - LeyanPeng</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 580px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .avatar {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.9rem;
      margin-bottom: 28px;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      text-align: left;
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 24px;
    }
    .info-item {
      background: rgba(15, 23, 42, 0.6);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 4px;
    }
    .info-val {
      font-size: 0.92rem;
      color: #e2e8f0;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🚀</div>
    <h1>Hi NUS Antigravity Hackathon! I am LeyanPeng</h1>
    <div class="subtitle">NUS MSBA Build with Antigravity Hands-on Lab (2026-11-23)</div>
    <div class="badge">Status: Initial Environment Verification Passed ✅</div>
    
    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Assigned Track</div>
        <div class="info-val">Track 1: COE Price Intelligence</div>
      </div>
      <div class="info-item">
        <div class="info-label">Deliverable Workspace</div>
        <div class="info-val">submissions/LeyanPeng/</div>
      </div>
    </div>
  </div>
</body>
</html>
